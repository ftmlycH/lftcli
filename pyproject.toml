[project]
name = "lofter-cli"
version = "0.1.0"
description = "Terminal reader for LOFTER text posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lftcli = "lftcli.main:main"
lofter = "lftcli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
